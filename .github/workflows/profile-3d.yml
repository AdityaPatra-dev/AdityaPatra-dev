name: GitHub Profile 3D Contributions
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated images
        run: |
          git config user.name "AdityaPatra-dev"
          git config user.email "adityapatraraj@gmail.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 3D contribution profile"
            git pull --rebase origin main || true
            git push
          fi
