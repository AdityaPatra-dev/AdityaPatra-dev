name: Profile Telemetry
on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_telemetry.py
      - name: Update featured projects and repository matrix
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_readme_projects.py
      - name: Commit updates
        run: |
          git config user.name "AdityaPatra-dev"
          git config user.email "adityapatraraj@gmail.com"
          git add assets/telemetry.svg README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile telemetry and project showcase"
            git pull --rebase origin main || true
            git push
          fi
