name: Contribution Snake
on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github-light
            output/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit snake
        run: |
          git config user.name "AdityaPatra-dev"
          git config user.email "adityapatraraj@gmail.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update contribution snake"
            git pull --rebase origin main || true
            git push
          fi
