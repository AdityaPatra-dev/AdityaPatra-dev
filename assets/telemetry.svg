<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="320" rx="22" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Top Bar -->
  <g font-family="JetBrains Mono, monospace">
    <circle cx="36" cy="38" r="5" fill="#ef4444"/>
    <circle cx="54" cy="38" r="5" fill="#f59e0b"/>
    <circle cx="72" cy="38" r="5" fill="#10b981"/>
    <text x="96" y="43" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="1">ADITYA-TELEMETRY-ENGINE // NODE: CLOUD-LAB</text>
    
    <!-- Live Pulse -->
    <g transform="translate(940, 26)">
      <rect width="220" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="13" r="5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="17" fill="#6ee7b7" font-size="11" font-weight="600">ALL SYSTEMS ONLINE</text>
    </g>
  </g>
  
  <!-- Metric Cards -->
  <g transform="translate(35, 75)">
    <rect width="265" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="#22d3ee" rx="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5">PUBLIC REPOS</text>
    <text x="20" y="78" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800">10</text>
    <text x="20" y="112" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">Active Projects</text>
  </g>
  <g transform="translate(323, 75)">
    <rect width="265" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="#a78bfa" rx="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5">COMMUNITY</text>
    <text x="20" y="78" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800">7 Followers</text>
    <text x="20" y="112" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">23 Following</text>
  </g>
  <g transform="translate(611, 75)">
    <rect width="265" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="#fbbf24" rx="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5">STARGAZERS</text>
    <text x="20" y="78" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800">2 Stars</text>
    <text x="20" y="112" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">0 Forks</text>
  </g>
  <g transform="translate(899, 75)">
    <rect width="265" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="#34d399" rx="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5">CORE STACK</text>
    <text x="20" y="78" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800">Python</text>
    <text x="20" y="112" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">Cloud & MLOps</text>
  </g>
  <!-- Footer Telemetry Status Bar -->
  <g transform="translate(35, 235)" font-family="JetBrains Mono, monospace">
    <rect width="1130" height="60" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="27" fill="#94a3b8" font-size="12">
      <tspan fill="#22d3ee">▸ Pipeline:</tspan> Automated GitHub CI/CD &nbsp;|&nbsp; 
      <tspan fill="#a78bfa">Primary Lang:</tspan> Python &nbsp;|&nbsp; 
      <tspan fill="#34d399">Portfolio:</tspan> adityapatradev.web.app
    </text>
    <text x="20" y="47" fill="#64748b" font-size="11">
      Last synchronized: 2026-10-01 09:57 UTC (UTC) • Host: GitHub Actions runner
    </text>
    <g transform="translate(1085, 24)">
      <circle cx="8" cy="8" r="4" fill="#22d3ee">
        <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>