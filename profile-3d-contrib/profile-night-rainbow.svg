<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="320">
  <defs>
    <linearGradient id="bg3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="850" height="320" rx="18" fill="url(#bg3d)" stroke="#1e293b"/>
  <text x="35" y="45" fill="#22d3ee" font-family="monospace" font-size="16" font-weight="700">3D CONTRIBUTION MATRIX // VISUAL MATRIX ENGINE</text>
  <text x="35" y="68" fill="#64748b" font-family="monospace" font-size="12">Isometric representation of commits, pull requests, and code activity</text>

  <!-- Isometric 3D Grid Representation -->
  <g transform="translate(180, 110)">
    <!-- Isometric row 1 -->
    <path d="M240 120 L270 102 L300 120 L270 138 Z" fill="#1e293b" stroke="#334155"/>
    <path d="M270 102 L300 84 L330 102 L300 120 Z" fill="#1e293b" stroke="#334155"/>
    <path d="M300 84 L330 66 L360 84 L330 102 Z" fill="#1e293b" stroke="#334155"/>

    <!-- 3D Bar 1 (Cyan) -->
    <path d="M150 110 L180 92 L180 50 L150 68 Z" fill="#0891b2"/>
    <path d="M180 92 L210 110 L210 68 L180 50 Z" fill="#06b6d4"/>
    <path d="M150 68 L180 50 L210 68 L180 86 Z" fill="#22d3ee"/>

    <!-- 3D Bar 2 (Purple) -->
    <path d="M210 145 L240 127 L240 70 L210 88 Z" fill="#6d28d9"/>
    <path d="M240 127 L270 145 L270 88 L240 70 Z" fill="#7c3aed"/>
    <path d="M210 88 L240 70 L270 88 L240 106 Z" fill="#a78bfa"/>

    <!-- 3D Bar 3 (Emerald) -->
    <path d="M270 110 L300 92 L300 40 L270 58 Z" fill="#047857"/>
    <path d="M300 92 L330 110 L330 58 L300 40 Z" fill="#059669"/>
    <path d="M270 58 L300 40 L330 58 L300 76 Z" fill="#34d399"/>

    <!-- 3D Bar 4 (Pink/Rose) -->
    <path d="M330 145 L360 127 L360 60 L330 78 Z" fill="#be185d"/>
    <path d="M360 127 L390 145 L390 78 L360 60 Z" fill="#db2777"/>
    <path d="M330 78 L360 60 L390 78 L360 96 Z" fill="#f472b6"/>

    <!-- 3D Bar 5 (Amber) -->
    <path d="M390 110 L420 92 L420 45 L390 63 Z" fill="#b45309"/>
    <path d="M420 92 L450 110 L450 63 L420 45 Z" fill="#d97706"/>
    <path d="M390 63 L420 45 L450 63 L420 81 Z" fill="#fbbf24"/>
  </g>

  <!-- Status footer -->
  <g transform="translate(35, 275)" font-family="monospace">
    <circle cx="8" cy="8" r="4" fill="#34d399"/>
    <text x="24" y="12" fill="#94a3b8" font-size="12">Matrix Pipeline: Scheduled daily updates via GitHub Actions</text>
  </g>
</svg>
